<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk | HIMAPTIKA</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&family=Schibsted+Grotesk:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Ganti warna ini dengan warna logo HIMAPTIKA */
      :root {
        --accent: #fff112; /* kuning logo HIMAPTIKA */
        --on-accent: #14120a; /* teks gelap di atas kuning */
        --deep: 13, 13, 10; /* hitam dasar (format R, G, B) */
        --bg: #0d0d0a;
        --glow-1: #3a3704; /* cahaya latar kiri atas */
        --glow-2: #26240a; /* cahaya latar kanan bawah */
        --ph-1: #6a6508; /* warna kartu foto sebelum foto dimuat */
        --ph-2: #2e2c04;
        --text: #fffdf0;
        --muted: rgba(255, 253, 240, 0.72);
        --glass-edge: rgba(255, 255, 255, 0.28);
        --error-text: #ffc4bf;
        --error-bg: rgba(200, 50, 40, 0.28);
        --glass: rgba(30, 28, 6, 0.45); /* warna panel kaca */
        --font-head:
          "Bricolage Grotesque", "Schibsted Grotesk", system-ui, sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family:
          "Schibsted Grotesk",
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: var(--text);
        background:
          radial-gradient(
            ellipse at 25% 15%,
            var(--glow-1) 0%,
            transparent 55%
          ),
          radial-gradient(
            ellipse at 80% 90%,
            var(--glow-2) 0%,
            transparent 50%
          ),
          var(--bg);
      }

      /* Dinding foto yang mengalir turun */
      #stage {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        perspective: 1200px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 1.4s ease;
        -webkit-mask-image: linear-gradient(
          transparent 0,
          #000 14%,
          #000 86%,
          transparent 100%
        );
        mask-image: linear-gradient(
          transparent 0,
          #000 14%,
          #000 86%,
          transparent 100%
        );
      }
      #stage.on {
        opacity: 1;
      }

      #wall {
        position: absolute;
        left: -20%;
        top: -20%;
        width: 140%;
        height: 140%;
        display: flex;
        gap: 16px;
        transform-style: preserve-3d;
        transform: rotateX(10deg) rotateY(-20deg) rotateZ(5deg);
      }

      .col {
        flex: 1;
        min-width: 0;
        height: 100%;
        overflow: hidden;
        transform: translateZ(var(--z, 0px));
      }

      .track {
        display: flex;
        flex-direction: column;
        animation: flow var(--dur, 60s) linear infinite;
        will-change: transform;
      }

      /* Satu set foto diulang dua kali, jadi -50% sampai 0 menyambung mulus */
      @keyframes flow {
        from {
          transform: translateY(-50%);
        }
        to {
          transform: translateY(0);
        }
      }

      .pic {
        position: relative;
        flex: none;
        width: 100%;
        aspect-ratio: var(--ar);
        margin: 0 0 16px;
        overflow: hidden;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: linear-gradient(
          135deg,
          var(--ph-1),
          var(--ph-2)
        ); /* tampil kalau foto belum ada */
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
      }

      .pic img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .pic figcaption {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 20px 10px 8px;
        font-size: 12px;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(transparent, rgba(var(--deep), 0.85));
      }

      @media (prefers-reduced-motion: reduce) {
        .track {
          animation: none;
        }
      }

      /* Menggelapkan bagian tengah supaya teks di panel mudah dibaca */
      #shade {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background: radial-gradient(
          ellipse 36% 52% at 50% 50%,
          rgba(var(--deep), 0.6),
          transparent 100%
        );
      }

      /* Panel kaca */
      .panel {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 400px;
        padding: 32px;
        border-radius: 20px;
        background: var(--glass);
        border: 1px solid var(--glass-edge);
        -webkit-backdrop-filter: blur(20px) saturate(140%);
        backdrop-filter: blur(20px) saturate(140%);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.35),
          0 24px 60px rgba(0, 0, 0, 0.35);
      }

      @supports not (
        (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))
      ) {
        .panel {
          background: rgba(20, 19, 8, 0.94);
        }
      }

      .org {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 32px;
      }

      .org img {
        width: 60px;
        height: 60px;
        object-fit: cover;
        border-radius: 12px;
      }

      .org strong {
        display: block;
        font-family: var(--font-head);
        font-size: 18px;
        font-weight: 700;
        line-height: 1.2;
      }
      .org span {
        font-size: 13px;
        color: var(--muted);
      }

      h1 {
        font-family: var(--font-head);
        font-size: 32px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.1;
        margin-bottom: 24px;
      }

      .field {
        margin-bottom: 18px;
      }
      label {
        display: block;
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .hint-text {
        font-size: 13px;
        color: var(--muted);
        margin-top: 6px;
      }
      .control {
        position: relative;
      }

      input {
        width: 100%;
        height: 48px;
        padding: 0 14px;
        font: inherit;
        font-size: 16px;
        color: var(--text);
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 10px;
      }
      input::placeholder {
        color: rgba(255, 255, 255, 0.42);
      }
      #password {
        padding-right: 104px;
      }

      input:-webkit-autofill {
        -webkit-text-fill-color: var(--text);
        box-shadow: 0 0 0 100px rgba(38, 36, 10, 0.95) inset;
      }

      input:focus-visible,
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }

      .toggle {
        position: absolute;
        top: 0;
        right: 0;
        height: 48px;
        padding: 0 14px;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        color: var(--accent);
        background: none;
        border: none;
        cursor: pointer;
      }

      .message {
        display: none;
        font-size: 14px;
        line-height: 1.5;
        padding: 10px 12px;
        margin-bottom: 18px;
        border-radius: 10px;
        border-left: 4px solid #ff8a80;
        background: var(--error-bg);
        color: var(--error-text);
      }
      .message.show {
        display: block;
      }

      .submit {
        width: 100%;
        height: 48px;
        margin-top: 6px;
        font: inherit;
        font-size: 16px;
        font-weight: 700;
        color: var(--on-accent);
        background: var(--accent);
        border: none;
        border-radius: 10px;
        cursor: pointer;
      }
      .submit:hover {
        background: #ffe94d;
      }
      .submit:disabled {
        opacity: 0.6;
        cursor: wait;
      }

      .help {
        font-size: 14px;
        color: var(--muted);
        line-height: 1.5;
        margin-top: 24px;
      }
      .help a {
        color: var(--accent);
        font-weight: 700;
      }

      /* HP: foto di atas, form di bawah */
      @media (max-width: 600px), (max-height: 720px) {
        body {
          padding: 12px;
        }
        #wall {
          transform: rotateX(8deg) rotateY(-12deg) rotateZ(4deg);
          gap: 10px;
        }
        .pic {
          margin-bottom: 10px;
        }
        #shade {
          background: radial-gradient(
            ellipse 36% 52% at 50% 50%,
            rgba(var(--deep), 0.6),
            transparent 100%
          );
        }
        .panel {
          padding: 20px 18px;
        }
        .org {
          margin-bottom: 18px;
        }
        .org img {
          width: 48px;
          height: 48px;
        }
        h1 {
          font-size: 28px;
          margin-bottom: 16px;
        }
        .field {
          margin-bottom: 14px;
        }
        .help {
          margin-top: 16px;
          font-size: 13px;
        }
      }
    </style>
  </head>

  <body>
    <div id="stage" aria-hidden="true">
      <div id="wall"></div>
    </div>
    <div id="shade"></div>

    <main class="panel">
      <div class="org">
        <img src="images/logo himaptika.png" alt="" />
        <div>
          <strong>HIMAPTIKA</strong>
          <span>Pendidikan Matematika FKIP Untad</span>
        </div>
      </div>

      <h1>Masuk</h1>

      <div id="message" class="message" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="nim">NIM</label>
          <input
            type="text"
            id="nim"
            placeholder="A23124080"
            autocomplete="username"
            autocapitalize="characters"
            required
          />
          <p class="hint-text">Gunakan NIM yang tertulis di KTM.</p>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="control">
            <input
              type="password"
              id="password"
              autocomplete="current-password"
              required
            />
            <button
              type="button"
              class="toggle"
              id="togglePassword"
              aria-controls="password"
            >
              Lihat
            </button>
          </div>
        </div>

        <button type="submit" class="submit" id="loginButton">Masuk</button>
      </form>

      <p class="help">
        Lupa password atau belum punya akun?
        <a
          href="https://wa.me/6289529633835?text=Halo%2C%20saya%20butuh%20bantuan%20akun%20portal%20HIMAPTIKA."
          target="_blank"
          rel="noopener"
          >Chat pengurus lewat WhatsApp</a
        >.
      </p>
    </main>

    <!-- Foto mengalir turun -->
    <script>
      (function () {
        // Daftar foto. Ganti dengan foto kegiatan dan kepengurusan kalian.
        // Makin banyak makin bagus (idealnya 12 atau lebih). "label" boleh dikosongkan.
        // Kalau file foto belum ada, kartu tampil sebagai blok warna.
        const FOTO = [
          { src: "images/INTI.JPEG", label: "Pengurus inti" },
          { src: "images/rapat-kerja.jpg", label: "Rapat kerja" },
          {
            src: "images/pengabdian.jpg",
            label: "Pengabdian masyarakat",
          },
          { src: "images/olimpiade.jpg", label: "Olimpiade matematika" },
          { src: "images/seminar.jpg", label: "Seminar pendidikan" },
          {
            src: "images/anggota-baru.jpg",
            label: "Penerimaan anggota baru",
          },
          { src: "images/kunjungan.jpg", label: "Kunjungan sekolah" },
          { src: "images/pengurus.jpg", label: "Foto bersama pengurus" },
        ];

        if (!FOTO.length) return;

        // Variasi bentuk foto supaya susunannya tidak kaku seperti kotak-kotak
        const RATIOS = ["3 / 4", "1 / 1", "4 / 3", "4 / 5", "1 / 1", "3 / 4"];

        const stage = document.getElementById("stage");
        const wall = document.getElementById("wall");
        let lastCols = 0;

        const columnCount = () => {
          const vw = window.innerWidth;
          return vw < 600 ? 3 : vw < 1100 ? 5 : 7;
        };

        function makePic(f, ratio) {
          const fig = document.createElement("figure");
          fig.className = "pic";
          fig.style.setProperty("--ar", ratio);

          const img = new Image();
          img.src = f.src;
          img.alt = "";
          img.decoding = "async";
          img.draggable = false;
          img.onerror = () => img.remove();
          fig.appendChild(img);

          if (f.label) {
            const cap = document.createElement("figcaption");
            cap.textContent = f.label;
            fig.appendChild(cap);
          }
          return fig;
        }

        function build() {
          const n = columnCount();
          lastCols = n;
          wall.textContent = "";

          // Perkiraan jumlah foto per set supaya satu set lebih tinggi dari dinding
          const colW = (stage.clientWidth * 1.4) / n - 16;
          const tall = Math.max(
            window.innerHeight,
            window.screen.height,
            stage.clientHeight,
          );
          const need = Math.min(
            14,
            Math.ceil((tall * 1.5) / (colW * 0.75 + 16)) + 1,
          );

          for (let c = 0; c < n; c++) {
            const col = document.createElement("div");
            col.className = "col";
            col.style.setProperty("--z", ((c % 3) - 1) * 50 + "px");

            const track = document.createElement("div");
            track.className = "track";
            track.style.setProperty("--dur", 45 + ((c * 7) % 30) + "s");

            // Set yang sama dibuat dua kali supaya putarannya menyambung tanpa lompatan
            for (let rep = 0; rep < 2; rep++) {
              for (let i = 0; i < need; i++) {
                const f = FOTO[(c * 3 + i) % FOTO.length];
                track.appendChild(
                  makePic(f, RATIOS[(c * 2 + i) % RATIOS.length]),
                );
              }
            }

            col.appendChild(track);
            wall.appendChild(col);
          }
        }

        build();
        requestAnimationFrame(() => stage.classList.add("on"));

        let timer;
        window.addEventListener("resize", () => {
          clearTimeout(timer);
          timer = setTimeout(() => {
            if (columnCount() !== lastCols) build();
          }, 250);
        });
      })();
    </script>

    <!-- Login Firebase -->
    <script type="module">
      import { auth } from "./js/firebase.js";
      import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

      // Akun yang sudah ada dibuat dengan @gmail.com, jadi nilai ini dibiarkan sama.
      // Kalau akun dibuat ulang, pakai domain yang jelas bukan email asli (mis. "himaptika.local").
      const EMAIL_DOMAIN = "gmail.com";

      const form = document.getElementById("loginForm");
      const nimInput = document.getElementById("nim");
      const passwordInput = document.getElementById("password");
      const toggle = document.getElementById("togglePassword");
      const button = document.getElementById("loginButton");
      const message = document.getElementById("message");

      const wrong = "NIM atau password salah. Periksa lagi, lalu coba masuk.";
      const errors = {
        "auth/invalid-credential": wrong,
        "auth/wrong-password": wrong,
        "auth/user-not-found": wrong,
        "auth/invalid-email": "Format NIM tidak valid. Periksa lagi NIM kamu.",
        "auth/user-disabled":
          "Akun ini dinonaktifkan. Hubungi pengurus HIMAPTIKA.",
        "auth/too-many-requests":
          "Terlalu banyak percobaan. Tunggu beberapa menit, lalu coba lagi.",
        "auth/network-request-failed":
          "Tidak ada koneksi internet. Periksa koneksi, lalu coba lagi.",
        "auth/operation-not-allowed":
          "Login email/password belum diaktifkan di Firebase.",
      };

      function showError(text) {
        message.textContent = text;
        message.classList.add("show");
      }

      toggle.addEventListener("click", () => {
        const hidden = passwordInput.type === "password";
        passwordInput.type = hidden ? "text" : "password";
        toggle.textContent = hidden ? "Sembunyikan" : "Lihat";
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        message.classList.remove("show");

        const nim = nimInput.value.trim();
        const password = passwordInput.value;

        if (!nim) {
          showError("Isi NIM kamu.");
          nimInput.focus();
          return;
        }
        if (!password) {
          showError("Isi password kamu.");
          passwordInput.focus();
          return;
        }

        button.disabled = true;
        button.textContent = "Memproses…";

        try {
          await signInWithEmailAndPassword(
            auth,
            `${nim.toLowerCase()}@${EMAIL_DOMAIN}`,
            password,
          );
          window.location.href = "index.html";
        } catch (error) {
          console.error("Login error:", error.code, error.message);
          showError(
            errors[error.code] || "Gagal masuk. Coba lagi sebentar lagi.",
          );
          button.disabled = false;
          button.textContent = "Masuk";
        }
      });
    </script>
  </body>
</html>
